# Alembic Configuration File
# Database URL is read from .env via env.py — do NOT hardcode it here.

[alembic]
script_location = pm_agent/app/db/migrations
prepend_sys_path = .

# This is intentionally blank — env.py injects the URL from .env at runtime.
# sqlalchemy.url is set programmatically in env.py, never here.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
